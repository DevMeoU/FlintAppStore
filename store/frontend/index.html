<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f3f3"><title>Flint App Store</title><link rel="stylesheet" href="/assets/style.css"><script src="/assets/app.js" defer></script></head>
<body>

<div id="account"></div></header>
<aside class="sidebar" aria-label="Điều hướng chính"><nav>
<a href="#catalog" data-nav="catalog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-8H9v8H4a1 1 0 0 1-1-1z"/></svg><span>Trang chủ</span></a>

<a href="#orders" data-nav="orders"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg><span>Đơn mua</span></a>
<a href="#admin" data-nav="admin" id="admin-nav" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M17.5 13v9M13 17.5h9"/></svg><span>Quản lý</span></a>
</nav><div class="sidebar-foot"><a href="#library" data-nav="library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16M8 4v16m4-16v16m4-15 4 14"/></svg><span>Thư viện</span></a><a id="figma-link" target="_blank" rel="noreferrer" aria-label="Xem thiết kế FlintUI"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7m-1-6L10 14M11 5H4v15h15v-7"/></svg><span>FlintUI</span></a></div></aside>
<div class="workspace"><main id="main" tabindex="-1" aria-live="polite"></main><footer>Flint App Store · Ứng dụng cho FlintOS <span>Thanh toán mô phỏng · Không thu tiền thật</span></footer></div>
